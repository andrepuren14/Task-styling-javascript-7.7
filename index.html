<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment brands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>


    <main class="main">
        <section class="brands-section">
            <header class="brands-header">
                <h2>REPAIR OF EQUIPMENT FROM VARIOUS BRANDS</h2>
            </header>

            <div class="swiper brands-slider">
                <div class="swiper-wrapper brands-list" id="brandsList">
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/lenovo.png" alt="lenovo" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Lenovo repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/samsung.png" alt="samsung" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Samsung repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/apple.png" alt="apple" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Apple repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/viewsonic.png" alt="viewSonic" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View viewSonic repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/bosch.png" alt="bosch" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Bosch repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/hp.png" alt="hp" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View HP repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/acer.png" alt="acer" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Acer repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/sony.png" alt="sony" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Sony repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/lenovo.png" alt="lenovo 2" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Lenovo repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/samsung.png" alt="samsung 2" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Samsung repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                    <div class="swiper-slide brand-item">
                        <img src="Assets/images/apple.png" alt="apple 2" class="brand-logo">
                        <button class="brand-btn" type="button" aria-label="View Apple repair">
                            <span class="arrow-icon"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="swiper-pagination"></div>

            <button class="toggle-btn" id="toggleBtn" type="button">
                <span class="toggle-btn__icon"></span>
                <span class="toggle-btn__text">Show All</span>
            </button>


        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>


</body>

</html>
